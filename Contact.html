<div class="container mt-5">
  <h2 class="text-center">Order Enquiry</h2>

  <form action="https://formsubmit.co/abcd@gmail.com" method="POST">
    <input type="text" name="name" class="form-control mb-3" placeholder="Your Name" required>
    <input type="tel" name="phone" class="form-control mb-3" placeholder="Phone Number" required>

    <select name="meal" class="form-control mb-3">
      <option>Breakfast</option>
      <option>Lunch</option>
      <option>Dinner</option>
    </select>

    <textarea name="message" class="form-control mb-3" placeholder="Your Order Details"></textarea>

    <button class="btn btn-success w-100">Send Enquiry</button>
  </form>

  <p class="text-center mt-3">Or call: 9876543210</p>
